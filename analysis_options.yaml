include: package:very_good_analysis/analysis_options.yaml

analyzer:
  errors:
    # freezed / json_serializable place annotations on synthetic targets
    invalid_annotation_target: ignore
  exclude:
    - "**/*.freezed.dart"
    - "**/*.g.dart"
    - "lib/firebase_options.dart"
    - "build/**"

linter:
  rules:
    # App code, not a published package: API doc comments not required.
    public_member_api_docs: false
    # The design system intentionally uses long token/style expressions.
    lines_longer_than_80_chars: false
    # We use relative imports within lib/ (consistent, feature-first layout).
    always_use_package_imports: false
    # We keep `super.key` first; required-after-optional ordering conflicts.
    always_put_required_named_parameters_first: false
    # Source interfaces (one method now) are an intentional repository seam.
    one_member_abstracts: false
    # Controller `set(...)` methods are an intentional, explicit API.
    use_setters_to_change_properties: false
